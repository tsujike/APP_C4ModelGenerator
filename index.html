<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C4 Model Whiteboard Viewer</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span>ツールバー: [サンプル&#9662;]</span>
        <span id="level-controls">
          レベル:
          <button id="level-button-1" type="button" data-level="1">L1</button>
          <button id="level-button-2" type="button" data-level="2">L2</button>
          <button id="level-button-3" type="button" data-level="3">L3</button>
          <button id="level-button-4" type="button" data-level="4">L4</button>
          |
          <button id="level-auto-button" type="button">AUTO</button>
        </span>
        <span id="level-status"></span>
        <button id="fit-button" type="button">Fit</button>
        <span id="zoom-readout">ズーム率 100%</span>
        <span>[SVG出力] [PNG出力]</span>
      </header>
      <section id="editor-pane">
        <p>エディタペイン(テキスト入力)</p>
      </section>
      <aside id="issues-panel">
        <p>エラー/警告パネル</p>
      </aside>
      <main id="viewer-pane">
        <div id="level-badge"></div>
        <div id="excalidraw-container"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
