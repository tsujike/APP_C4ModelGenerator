<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermarium(マーマリウム)</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span id="app-brand">Mermarium</span>
        <span id="title-controls">
          <input
            id="title-input"
            type="text"
            aria-label="ドキュメントタイトル"
            placeholder="Untitled"
          />
        </span>
        <span id="file-controls">
          ファイル:
          <button id="pick-file-button" type="button">ファイルを選択</button>
          <select id="file-history-select" aria-label="最近使ったファイル">
            <option value="" disabled selected>履歴...</option>
          </select>
          <button id="unlink-file-button" type="button" hidden>リンク解除</button>
          <input id="file-input" type="file" accept=".txt,.md,.mmd,.mermaid,text/plain" hidden />
          <span id="file-link-status" class="file-link-status" hidden></span>
        </span>
        <span id="level-controls">
          レベル:
          <button id="level-button-1" type="button" data-level="1">L1</button>
          <button id="level-button-2" type="button" data-level="2">L2</button>
          <button id="level-button-3" type="button" data-level="3">L3</button>
          <button id="level-button-4" type="button" data-level="4">L4</button>
          <button id="level-button-5" type="button" data-level="5">L5</button>
          <button id="level-button-6" type="button" data-level="6">L6</button>
          <button id="level-button-7" type="button" data-level="7">L7</button>
          <button id="level-button-8" type="button" data-level="8">L8</button>
          |
          <button id="level-auto-button" type="button">AUTO</button>
        </span>
        <span id="level-status"></span>
        <span id="axis-mode"></span>
        <button id="fit-button" type="button">Fit</button>
        <span id="zoom-readout">ズーム率 100%</span>
        <span id="export-controls">
          <button id="export-svg-button" type="button">SVG出力</button>
          <button id="export-png-button" type="button">PNG出力</button>
        </span>
      </header>
      <section id="editor-pane">
        <div id="editor-mount"></div>
      </section>
      <div
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="エディタ列とビューワー列の境界"
      ></div>
      <aside id="issues-panel">
        <div id="issues-panel-mount"></div>
      </aside>
      <main id="viewer-pane">
        <div id="level-badge"></div>
        <div id="excalidraw-container"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
